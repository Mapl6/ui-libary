# Local Docmost wiki for discussing and editing the library's documentation.
#   npm run docs:up      start (http://localhost:3100)
#   npm run docs:down    stop (data is kept in named volumes)
#   npm run docs:logs    follow the app logs
#
# Secrets come from docmost/.env (copy docmost/.env.example).

name: ui-library-docmost

services:
  docmost:
    image: docmost/docmost:latest
    depends_on:
      - db
      - redis
    environment:
      APP_URL: ${DOCMOST_APP_URL:-http://localhost:3100}
      APP_SECRET: ${DOCMOST_APP_SECRET:?Set DOCMOST_APP_SECRET in docmost/.env}
      DATABASE_URL: postgresql://docmost:${DOCMOST_DB_PASSWORD:?Set DOCMOST_DB_PASSWORD in docmost/.env}@db:5432/docmost?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${DOCMOST_PORT:-3100}:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DOCMOST_DB_PASSWORD}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
